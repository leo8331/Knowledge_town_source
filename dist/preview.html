<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ea">
<title>课程预览 · 拾知小镇</title>
<style>
:root{--bg:#f5f2e9;--paper:#fffdf8;--ink:#26372f;--green:#3f6252;--muted:#7f897f;--gold:#b79258;--line:#e1e4d9;--shadow:0 24px 80px rgba(32,48,40,.10);--content:1080px}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(183,146,88,.08),transparent 28rem),radial-gradient(circle at 92% 15%,rgba(111,141,121,.10),transparent 30rem),linear-gradient(180deg,#fbfaf5,var(--bg));min-height:100vh}a{text-decoration:none;color:inherit}.shell{width:min(calc(100% - 34px),var(--content));margin:auto}.topbar{border-bottom:1px solid rgba(225,228,217,.85);background:rgba(250,248,241,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.topbar-in{height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#557765,#365848);color:#fffdf8;font:700 20px Georgia,"Songti SC",serif}.brand strong{font:700 17px Georgia,"Songti SC",serif;color:#2f4a3c}.brand small{display:block;font-size:8px;letter-spacing:.17em;color:#8a948a;font-weight:800}.back{padding:9px 12px;border-radius:999px;border:1px solid #d9dfd4;background:#fffdf8;color:#4d6555;font-size:10px;font-weight:900}.hero{padding:34px 0 18px}.hero small{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#708072;font-weight:900}.hero small:before{content:"";width:24px;height:1px;background:var(--gold)}.hero h1{margin:9px 0 9px;font:700 clamp(34px,5vw,58px)/1.08 Georgia,"Songti SC",serif;color:#30493c;letter-spacing:-.03em}.hero p{margin:0;max-width:780px;font-size:13px;line-height:1.8;color:#6f7a70}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.meta span{padding:7px 9px;border-radius:999px;background:#edf2e8;border:1px solid #dce4d8;font-size:9px;font-weight:900;color:#5d735f}.cover{height:390px;border-radius:28px;overflow:hidden;position:relative;background-position:center;background-size:cover;box-shadow:var(--shadow);border:1px solid #dfe3d8}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,43,34,.02),rgba(26,43,34,.65))}.cover-copy{position:absolute;left:28px;right:28px;bottom:25px;z-index:1;color:#fff}.cover-copy small{font-size:10px;letter-spacing:.14em;font-weight:900}.cover-copy h2{margin:5px 0 0;font:700 clamp(30px,4vw,48px) Georgia,"Songti SC",serif}.content{padding:20px 0 46px;display:grid;grid-template-columns:1fr .72fr;gap:14px}.card{border-radius:22px;background:rgba(255,253,248,.9);border:1px solid #dfe3d8;padding:18px;box-shadow:0 12px 34px rgba(32,48,40,.06)}.card h3{margin:0 0 11px;font:700 19px Georgia,"Songti SC",serif;color:#3d594a}.point{padding:10px 11px;border-radius:12px;background:#f1f4ed;margin:7px 0;font-size:11px;line-height:1.65;color:#5e6f62}.module{padding:11px;border-radius:13px;background:#f7f6ef;border:1px solid #e4e6de;margin:8px 0}.module b{display:block;font-size:11px;color:#486052;margin-bottom:4px}.module span{font-size:10px;line-height:1.6;color:#7b867d}.quiz{margin-top:14px;padding:14px;border-radius:16px;background:#eef3e9;border:1px solid #dce4d8}.quiz strong{display:block;font-size:11px;color:#486052;margin-bottom:8px}.choice{padding:9px 10px;border-radius:10px;background:#fffdf8;border:1px solid #dfe3d8;margin:6px 0;font-size:10px;color:#647165}.play-card{margin:18px 0;padding:18px;border-radius:22px;background:#eef3e9;border:1px solid #dce4d8}.play-card h3{margin:0 0 8px;font:700 20px Georgia,"Songti SC",serif;color:#3d594a}.play-card p{margin:0 0 12px;color:#728076;font-size:11px;line-height:1.7}.play-actions{display:flex;gap:8px;flex-wrap:wrap}.play-btn{border:1px solid #d1ddd0;background:#fffdf8;color:#486253;border-radius:12px;padding:10px 13px;font-size:10px;font-weight:900;cursor:pointer}.play-btn.primary{background:#3f6252;color:#fff}.play-result{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#fffdf8;border:1px solid #dfe5dc;color:#5e6f62;font-size:11px;line-height:1.7}.play-result.show{display:block}.empty{padding:70px 20px;text-align:center;color:#758077}.empty h2{font:700 28px Georgia,"Songti SC",serif;color:#3b5547}.empty a{display:inline-block;margin-top:10px;padding:11px 14px;border-radius:13px;background:#3f6252;color:#fff;font-size:11px;font-weight:900}@media(max-width:760px){.cover{height:300px}.content{grid-template-columns:1fr}.cover-copy{left:20px;right:20px}.hero{padding-top:24px}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topbar-in"><a class="brand" href="index.html"><span class="logo">拾</span><span><strong>拾知小镇</strong><small>KNOWLEDGE TOWN</small></span></a><a class="back" href="workbench.html">打开工作台</a></div></header>
<main id="app"></main>
<script src="course-presentation.js"></script>
<script>
function decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const app=document.getElementById('app');const m=location.hash.match(/data=([^&]+)/);const saved=!m?localStorage.getItem('knowledgeTownPreview'):null;if(!m&&!saved){app.innerHTML='<section class="shell empty"><h2>还没有课程预览</h2><p>请先在工作台完成 AI 生成，然后从“预览发布”生成分享链接。</p><a href="workbench.html">进入工作台</a></section>';return}try{const d=m?decode(m[1]):JSON.parse(saved);const title=CoursePresentation.cleanTitle(d.title,(d.points||[])[0]||'学习课程');app.innerHTML=`<section class="hero"><div class="shell"><small>Published Course Preview</small><h1>${esc(title)}</h1><p>${esc(d.summary||'')}</p><div class="meta"><span>${esc(d.templateName||'课程模板')}</span><span>来源：${esc(d.sourceName||'资料')}</span>${d.customStyle?`<span>${esc(d.customStyle)}</span>`:''}</div></div></section><section class="shell"><div class="cover" id="previewCover"><div class="cover-copy"><small>KNOWLEDGE TOWN · INTERACTIVE COURSE</small><h2>${esc(title)}</h2></div></div><div class="play-card"><h3>进入互动学习 Demo</h3><p>点击开始任务，选择判断并查看反馈。之后可以继续进入完整拾知小镇。</p><div class="play-actions"><a class="play-btn primary" href="custom-game.html">开始互动任务</a><a class="play-btn" href="game.html">进入拾知小镇</a><a class="play-btn" href="workbench.html">返回工作台</a></div><div class="play-result" id="playResult"></div></div><div class="content"><article class="card"><h3>核心知识</h3>${(d.points||[]).map((p,i)=>`<div class="point">${String(i+1).padStart(2,'0')} · ${esc(p)}</div>`).join('')}</article><aside><div class="card"><h3>课程结构</h3>${(d.modules||[]).map((x,i)=>`<div class="module"><b>${String(i+1).padStart(2,'0')} ${esc(x.name)}</b><span>${esc(x.goal||'')}</span></div>`).join('')}<div class="quiz"><strong>示例互动题</strong><div class="choice">${esc(d.exercise||'根据课程内容完成一次判断挑战。')}</div><div class="choice">○ 依据资料判断</div><div class="choice">○ 凭直觉直接选择</div></div></div></aside></div></section>`;CoursePresentation.applyBackground(document.getElementById('previewCover'),d)}catch(e){app.innerHTML='<section class="shell empty"><h2>预览链接无法读取</h2><p>链接内容可能不完整，请回到工作台重新发布一次。</p><a href="workbench.html">返回工作台</a></section>'}}render();window.addEventListener('hashchange',render);const btn=document.getElementById('startPlay'),out=document.getElementById('playResult');if(btn)btn.onclick=()=>{out.classList.add('show');out.textContent='任务 1：判断这条资料是否属于核心知识。请选择一个答案。';const yes=document.createElement('button');yes.className='play-btn';yes.textContent='依据资料判断';yes.onclick=()=>{out.textContent='回答已记录，继续探索下一个任务。'};const no=document.createElement('button');no.className='play-btn';no.textContent='先回看资料';no.onclick=()=>{out.textContent='请先回看资料，再做一次选择。'};out.append(document.createElement('br'),yes,no)};
</script>
</body></html>
