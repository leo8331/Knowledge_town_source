<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动学习 · 拾知小镇</title><style>body{margin:0;background:#20352c;color:#fff;font-family:"Microsoft YaHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:18px}.game{min-height:calc(100vh - 36px);border-radius:28px;overflow:hidden;position:relative;background:#30483b}.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.48}.layer{position:relative;z-index:1;padding:18px}.hud{display:flex;justify-content:space-between;align-items:center}.hud strong{font:700 24px Georgia,serif}.back{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:999px;padding:9px 13px;font-size:11px;text-decoration:none}.task{max-width:580px;margin:90px auto 0;padding:24px;border-radius:24px;background:#fffdf8;color:#30493c;box-shadow:0 20px 60px #14251d88}.task h1{margin:0 0 9px;font:700 28px Georgia,serif}.task p{color:#728076;font-size:12px;line-height:1.8}.options{display:grid;gap:9px;margin-top:16px}.option{border:1px solid #d6e0d3;background:#fff;color:#486253;border-radius:13px;padding:13px;text-align:left;font-size:11px;font-weight:800;cursor:pointer}.option:hover{background:#edf3e9}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#edf3e9;color:#55705c;font-size:11px;line-height:1.7}.feedback.show{display:block}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.links a{padding:10px 12px;border-radius:11px;background:#3f6252;color:#fff;text-decoration:none;font-size:10px;font-weight:900}</style></head><body><div class="wrap"><main class="game"><div id="bg" class="bg"></div><div class="layer"><div class="hud"><strong id="title">互动学习</strong><a class="back" href="preview.html">返回预览</a></div><section class="task"><h1>任务 1：找出核心知识</h1><p>阅读课程资料后，选择最符合“核心知识”的判断。选择后会立即得到反馈。</p><div class="options"><button class="option" data-correct="1">依据资料中的定义和证据判断</button><button class="option">凭直觉选择最醒目的说法</button><button class="option">先跳过，不查看资料</button></div><div id="feedback" class="feedback"></div><div class="links"><a href="game.html">进入拾知小镇</a><a href="workbench.html">返回工作台</a></div></section></div></main></div><script>const d=JSON.parse(localStorage.getItem('knowledgeTownPreview')||'{}');document.getElementById('title').textContent=d.title||'互动学习';if(d.customImage)document.getElementById('bg').style.backgroundImage='url("'+d.customImage+'")';else if(d.template==='forest')document.getElementById('bg').style.backgroundImage="url('https://raw.githubusercontent.com/Abigale365/Knowledge_town/main/dist/assets/world-grove.webp')";document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const f=document.getElementById('feedback');f.classList.add('show');f.textContent=b.dataset.correct?'回答正确：你抓住了资料中的定义和证据。可以继续进入小镇探索。':'这次选择没有依据资料。回看课程内容，再试一次。'})</script></body></html>
